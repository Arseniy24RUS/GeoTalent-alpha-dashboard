<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="640" viewBox="0 0 1040 640" role="img" aria-labelledby="title desc">
  <title id="title">Рабочий контур доказательств GeoTalent</title>
  <desc id="desc">Схема показывает путь от публичных STEM-источников через сборку данных к статическому дашборду, карте, профилю территории, лабораториям, Data Explorer и методическим ограничениям.</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="9" refY="6" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2947A0"/>
    </marker>
    <style>
      .bg{fill:#f6f8fc}
      .panel{fill:#fff;stroke:#cfd8e6;stroke-width:2}
      .panel-blue{fill:#eef5ff;stroke:#2947A0;stroke-width:2}
      .panel-green{fill:#eef9f7;stroke:#539D96;stroke-width:2}
      .title{font:700 32px Arial,sans-serif;fill:#0a132d}
      .subtitle{font:400 22px Arial,sans-serif;fill:#3d4a60}
      .kicker{font:700 18px Arial,sans-serif;letter-spacing:2px;fill:#539D96}
      .heading{font:700 25px Arial,sans-serif;fill:#0a132d}
      .body{font:400 22px Arial,sans-serif;fill:#243047}
      .small{font:400 22px Arial,sans-serif;fill:#4b5870}
      .arrow{stroke:#2947A0;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .dash{stroke:#93a4c2;stroke-width:2;stroke-dasharray:7 7;fill:none}
    </style>
  </defs>
  <rect class="bg" width="1040" height="640" rx="0"/>
  <text class="title" x="40" y="56">Рабочий контур доказательств GeoTalent</text>
  <text class="subtitle" x="40" y="90">Статическая витрина GitHub Pages для спроса, занятости и компаний в STEM</text>

  <rect class="panel" x="40" y="130" width="270" height="170" rx="8"/>
  <text class="kicker" x="64" y="164">ВХОДЫ</text>
  <text class="heading" x="64" y="198">Семь источников</text>
  <text class="body" x="64" y="232">EURES, Adzuna,</text>
  <text class="body" x="64" y="260">Eurostat, BLS,</text>
  <text class="body" x="64" y="288">StatCan, UK NOMIS</text>

  <rect class="panel-blue" x="385" y="130" width="270" height="170" rx="8"/>
  <text class="kicker" x="409" y="164">КОНТРАКТ СБОРКИ</text>
  <text class="heading" x="409" y="198">Нормализация</text>
  <text class="body" x="409" y="232">scripts/build_data.py</text>
  <text class="body" x="409" y="260">реестр SHA-256</text>
  <text class="body" x="409" y="288">публичный паспорт</text>

  <rect class="panel" x="730" y="130" width="270" height="170" rx="8"/>
  <text class="kicker" x="754" y="164">СТАТИЧЕСКИЕ ФАЙЛЫ</text>
  <text class="heading" x="754" y="198">Файлы для Pages</text>
  <text class="body" x="754" y="232">JSON для интерфейса</text>
  <text class="body" x="754" y="260">CSV / Parquet выгрузки</text>
  <text class="body" x="754" y="288">production-сборка docs/</text>

  <path class="arrow" d="M312 215 H370"/>
  <path class="arrow" d="M657 215 H715"/>

  <rect class="panel-green" x="115" y="382" width="360" height="190" rx="8"/>
  <text class="kicker" x="139" y="416">СЦЕНАРИЙ ПОЛЬЗОВАТЕЛЯ</text>
  <text class="heading" x="139" y="450">От карты к строкам</text>
  <text class="body" x="139" y="484">Источник, период, группа,</text>
  <text class="body" x="139" y="512">территория, профиль;</text>
  <text class="body" x="139" y="540">проверка строк и CSV.</text>

  <rect class="panel" x="565" y="382" width="360" height="190" rx="8"/>
  <text class="kicker" x="589" y="416">МЕТОДИЧЕСКИЕ ОГРАНИЧЕНИЯ</text>
  <text class="heading" x="589" y="450">Без ложных сумм</text>
  <text class="body" x="589" y="484">Единицы и таксономии</text>
  <text class="body" x="589" y="512">разделены; вакансии</text>
  <text class="body" x="589" y="540">это снимки, не тренды.</text>

  <path class="arrow" d="M865 302 V340 H302 V372"/>
  <path class="arrow" d="M475 477 H550"/>
  <path class="dash" d="M520 302 V340"/>
  <text class="small" x="382" y="366">24 219 строк остаются проверяемыми до исходника</text>
</svg>
